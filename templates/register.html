{% extends "base.html" %}

{% block title %}Create account | CareerAI{% endblock %}

{% block content %}
<section class="auth-layout">
    <div class="auth-card">
        <p class="eyebrow">CareerAI</p>
        <h1>Create your account</h1>
        <p class="auth-description">Start building a clearer picture of your resume and career direction.</p>

        <form method="POST" class="auth-form" data-password-confirmation-form>
            <div class="form-field">
                <label for="fullname">Full name</label>
                <input class="form-control" type="text" id="fullname" name="fullname" autocomplete="name" placeholder="Your full name" required>
            </div>
            <div class="form-field">
                <label for="email">Email address</label>
                <input class="form-control" type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <div class="password-input-wrap">
                    <input class="form-control" type="password" id="password" name="password" autocomplete="new-password" placeholder="Create a password" required data-password-source>
                    <button class="input-action" type="button" data-password-toggle="password" aria-pressed="false">Show</button>
                </div>
            </div>
            <div class="form-field">
                <label for="confirm_password">Confirm password</label>
                <div class="password-input-wrap">
                    <input class="form-control" type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" placeholder="Repeat your password" required data-password-confirmation>
                    <button class="input-action" type="button" data-password-toggle="confirm_password" aria-pressed="false">Show</button>
                </div>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
    </div>
</section>
{% endblock %}
