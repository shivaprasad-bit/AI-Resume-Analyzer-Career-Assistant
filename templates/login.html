{% extends "base.html" %}

{% block title %}Sign in | CareerAI{% endblock %}

{% block content %}
<section class="auth-layout">
    <div class="auth-card">
        <p class="eyebrow">CareerAI</p>
        <h1>Welcome back</h1>
        <p class="auth-description">Sign in to review your resume analyses and career progress.</p>

        <form method="POST" class="auth-form">
            <div class="form-field">
                <label for="email">Email address</label>
                <input class="form-control" type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <div class="password-input-wrap">
                    <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
                    <button class="input-action" type="button" data-password-toggle="password" aria-pressed="false">Show</button>
                </div>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>

        <p class="auth-switch">New to CareerAI? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</section>
{% endblock %}
